<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-title" content="sloverb" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="slowed and reverb or nightcore for any song" />
    <title>sloverb</title>
    <!-- the theme kept from last time (see src/look.ts), before anything is drawn, so a light page never opens black -->
    <script>
      try {
        document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("sloverb.look")).theme;
      } catch (e) {}
    </script>
    <!-- the three bars that move beside the playing song, in the blue, purple and pink of the first theme -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9'/><rect x='7.5' y='15' width='4.5' height='9.5' rx='2.25' fill='%234f8cff'/><rect x='13.75' y='7.5' width='4.5' height='17' rx='2.25' fill='%23a855f7'/><rect x='20' y='12' width='4.5' height='12.5' rx='2.25' fill='%23ff4d8d'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
