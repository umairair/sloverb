<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-title" content="sloverb" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="slowed and reverb or nightcore for any song" />
    <title>sloverb</title>
    <!-- the theme kept from last time (see src/look.ts), before anything is drawn, so a light page never opens black -->
    <script>
      try {
        document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("sloverb.look")).theme;
      } catch (e) {}
    </script>
    <!-- a sound wave: bars round a centre line like the waveform in the player, in the blue, purple and pink of the first theme -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='4' x2='28' gradientUnits='userSpaceOnUse'><stop stop-color='%234f8cff'/><stop offset='.5' stop-color='%23a855f7'/><stop offset='1' stop-color='%23ff4d8d'/></linearGradient></defs><rect width='32' height='32' rx='9'/><g fill='url(%23g)'><rect x='4.5' y='12.5' width='3' height='7' rx='1.5'/><rect x='9.5' y='8.5' width='3' height='15' rx='1.5'/><rect x='14.5' y='5' width='3' height='22' rx='1.5'/><rect x='19.5' y='10' width='3' height='12' rx='1.5'/><rect x='24.5' y='13' width='3' height='6' rx='1.5'/></g></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
