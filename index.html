<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-title" content="sloverb" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="slowed and reverb or nightcore for any song" />
    <title>sloverb</title>
    <!-- the theme kept from last time (see src/look.ts), before anything is drawn, so a light page never opens black -->
    <script>
      try {
        document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("sloverb.look")).theme;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9'/><circle cx='16' cy='16' r='4.5' fill='white'/><circle cx='16' cy='16' r='9.5' fill='none' stroke='white' stroke-opacity='.4' stroke-width='2'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
