<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ee" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-title" content="sloverb" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="slowed and reverb or nightcore for any song" />
    <title>sloverb.app</title>
    <!-- the look, before anything is drawn, so the page never opens in the wrong colours: light with rose for a first
         visit (LOOK in src/core/look.ts, keep the two the same), or whatever was kept from last time (src/look.ts).
         Anything kept before 2026-11-14 has an older theme name and a number for its glow. Those were all chosen while
         dark was what everyone got, so every name but light opens dark, in the colours it had -->
    <script>
      var page = document.documentElement;
      page.dataset.theme = "light";
      page.dataset.glow = "rose";
      try {
        var look = JSON.parse(localStorage.getItem("sloverb.look"));
        if (/^(default|dark|minimal|ember|ocean|forest)$/.test(look.theme)) page.dataset.theme = "dark";
        if (typeof look.glow === "string") page.dataset.glow = look.glow;
        else if (typeof look.theme === "string") page.dataset.glow = /^(ember|ocean|forest)$/.test(look.theme) ? look.theme : look.theme === "minimal" ? "mono" : "classic";
        // the glow effect at off holds the page still (src/look.ts); it was kept under `glow` before 2026-11-14
        if (look.amount === 0 || (look.amount === undefined && look.glow === 0)) page.setAttribute("data-still", "");
      } catch (e) {}
    </script>
    <!-- a sound wave: bars round a centre line like the waveform in the player, in paper on the hot pink, pink and peach
         of rose on light, the look a first visit gets (D22) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x2='32' y2='32' gradientUnits='userSpaceOnUse'><stop stop-color='%23fc3a78'/><stop offset='.55' stop-color='%23ff6a9c'/><stop offset='1' stop-color='%23ff9266'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><g fill='%23f4f3ee'><rect x='4.5' y='12.5' width='3' height='7' rx='1.5'/><rect x='9.5' y='8.5' width='3' height='15' rx='1.5'/><rect x='14.5' y='5' width='3' height='22' rx='1.5'/><rect x='19.5' y='10' width='3' height='12' rx='1.5'/><rect x='24.5' y='13' width='3' height='6' rx='1.5'/></g></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
