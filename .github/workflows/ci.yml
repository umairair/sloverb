name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    # Keeps the documentation true with every change. See CLAUDE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Code changes come with doc changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-docs.sh "$BASE" "$HEAD" "$TITLE"
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - run: docker build -f backend/Dockerfile -t sloverb-import .
  windows:
    # The import worker runs on Windows (docs/worker.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - run: python -m py_compile windows/install.py windows/service.py
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc macos/WorkerApp.swift -o /tmp/SloverbWorker -framework AppKit -framework UserNotifications
